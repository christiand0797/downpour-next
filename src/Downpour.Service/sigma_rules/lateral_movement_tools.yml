title: BadUSB / Keystroke Injection Tool Detection
id: a1b2c3d4-e5f6-7a8b-9c0d-e1f2a3b4c5d6
status: stable
level: high
description: Detects execution of keystroke injection and BadUSB development tools
author: Downpour v29 Titanium
date: 2026/09/16
logsource:
    category: process_creation
    product: windows
detection:
    sel_tools:
        CommandLine|contains:
            - 'arduino-cli'
            - 'teensy_loader'
            - 'dfu-programmer'
            - 'dfu-util'
            - 'esptool'
    sel_hid:
        CommandLine|contains:
            - 'HID keyboard'
            - 'rubber ducky'
            - 'ducktoolkit'
            - 'usb-rubber-ducky'
            - 'flipper zero'
            - 'badusb'
    condition: 1 of sel*
tags:
    - attack.initial_access
    - attack.t1200
falsepositives:
    - Legitimate hardware development environments
