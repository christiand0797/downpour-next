title: Lateral Movement Tool Execution
id: 9f8e7d6c-5b4a-3c2d-1e0f-a9b8c7d6e5f4
status: stable
level: critical
description: Detects execution of lateral movement tools including PsExec, WMI remote, Impacket, CrackMapExec
author: Downpour v29 Titanium
date: 2026/09/16
logsource:
    category: process_creation
    product: windows
detection:
    sel_psexec:
        Image|endswith:
            - '\psexec.exe'
            - '\psexec64.exe'
            - '\paexec.exe'
            - '\remcom.exe'
            - '\csexec.exe'
    sel_wmi_remote:
        CommandLine|contains:
            - 'wmic /node:'
            - 'wmic.exe /node:'
    sel_winrs:
        Image|endswith: '\winrs.exe'
        CommandLine|contains: '-r:'
    sel_schtasks_remote:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains|all:
            - '/create'
            - '/s '
    sel_sc_remote:
        Image|endswith: '\sc.exe'
        CommandLine|contains: '\\\\'
    sel_impacket:
        CommandLine|contains:
            - 'wmiexec'
            - 'smbexec'
            - 'atexec'
            - 'dcomexec'
            - 'psexec.py'
            - 'secretsdump'
    sel_cme:
        CommandLine|contains:
            - 'crackmapexec'
            - 'netexec'
            - 'evil-winrm'
    condition: 1 of sel*
tags:
    - attack.lateral_movement
    - attack.t1021.002
    - attack.t1047
    - attack.t1053.005
falsepositives:
    - Legitimate system administration using PsExec
    - Authorized remote management tools
