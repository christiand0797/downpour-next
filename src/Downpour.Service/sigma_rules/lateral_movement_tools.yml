title: Shadow Copy Deletion - Ransomware Indicator
id: b2c3d4e5-f6a7-8b9c-0d1e-f2a3b4c5d6e7
status: stable
level: critical
description: Detects shadow copy deletion and backup sabotage commonly used by ransomware
author: Downpour v29 Titanium
date: 2026/09/16
logsource:
    category: process_creation
    product: windows
detection:
    sel_vssadmin:
        Image|endswith: '\vssadmin.exe'
        CommandLine|contains:
            - 'delete shadows'
            - 'resize shadowstorage'
    sel_wmic_shadow:
        Image|endswith: '\wmic.exe'
        CommandLine|contains:
            - 'shadowcopy delete'
            - 'shadowcopy where'
    sel_bcdedit:
        Image|endswith: '\bcdedit.exe'
        CommandLine|contains:
            - 'recoveryenabled No'
            - 'bootstatuspolicy ignoreallfailures'
    sel_wbadmin:
        Image|endswith: '\wbadmin.exe'
        CommandLine|contains:
            - 'delete catalog'
            - 'delete systemstatebackup'
    condition: 1 of sel*
tags:
    - attack.impact
    - attack.t1490
falsepositives:
    - Legitimate backup management by system administrators
---
title: Network Share Reconnaissance and Abuse
id: c3d4e5f6-a7b8-9c0d-1e2f-a3b4c5d6e7f8
status: stable
level: medium
description: Detects network share enumeration and suspicious share operations
author: Downpour v29 Titanium
date: 2026/09/16
logsource:
    category: process_creation
    product: windows
detection:
    sel_enum:
        Image|endswith:
            - '\net.exe'
            - '\net1.exe'
        CommandLine|contains:
            - 'share'
            - 'view \\\\'
            - 'use \\\\'
            - 'session'
    sel_admin_shares:
        CommandLine|contains:
            - '\\C$'
            - '\\ADMIN$'
            - '\\IPC$'
    sel_sharphound:
        CommandLine|contains:
            - 'SharpHound'
            - 'Invoke-ShareFinder'
            - 'Find-DomainShare'
    condition: 1 of sel*
tags:
    - attack.discovery
    - attack.t1135
    - attack.lateral_movement
    - attack.t1021.002
falsepositives:
    - Legitimate network administration
    - System backup scripts
