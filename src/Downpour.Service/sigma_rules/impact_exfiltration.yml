title: Screen Capture via Built-in Tools
id: downpour-sigma-105
status: stable
level: low
description: Detects screen capture using snippingtool or psr
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\SnippingTool.exe'
            - '\psr.exe'
    condition: selection
tags:
    - attack.collection
    - attack.t1113
