title: LSASS Memory Access via Known Tools
id: downpour-sigma-020
status: stable
level: critical
description: Detects common tools used to dump LSASS process memory
logsource:
    category: process_creation
    product: windows
detection:
    selection_tools:
        Image|endswith:
            - '\procdump.exe'
            - '\procdump64.exe'
            - '\sqldumper.exe'
    selection_lsass:
        CommandLine|contains:
            - 'lsass'
    condition: selection_tools and selection_lsass
tags:
    - attack.credential_access
    - attack.t1003.001
---
title: Mimikatz Command Line Indicators
id: downpour-sigma-021
status: stable
level: critical
description: Detects Mimikatz-style command line patterns
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains:
            - 'sekurlsa::logonpasswords'
            - 'sekurlsa::wdigest'
            - 'sekurlsa::kerberos'
            - 'lsadump::sam'
            - 'lsadump::dcsync'
            - 'lsadump::lsa'
            - 'token::elevate'
            - 'vault::cred'
            - 'dpapi::masterkey'
            - 'dpapi::chrome'
            - 'crypto::certificates'
    condition: selection
tags:
    - attack.credential_access
    - attack.t1003.001
    - attack.t1003.006
---
title: DPAPI Master Key Access Attempt
id: downpour-sigma-022
status: stable
level: high
description: Detects access to DPAPI master key files (credential theft indicator)
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains:
            - 'Protect\S-1-5'
            - 'Microsoft\\Protect'
            - 'dpapi::masterkey'
            - 'master.key'
    condition: selection
tags:
    - attack.credential_access
    - attack.t1555.004
---
title: Browser Credential Store Access
id: downpour-sigma-023
status: stable
level: high
description: Detects access to browser credential databases (Login Data, cookies, Web Data)
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains:
            - 'Login Data'
            - 'Web Data'
            - 'Cookies'
            - 'Local State'
    filter_browser:
        Image|endswith:
            - '\chrome.exe'
            - '\msedge.exe'
            - '\firefox.exe'
            - '\brave.exe'
    condition: selection and not filter_browser
tags:
    - attack.credential_access
    - attack.t1555.003
---
title: Windows Credential Manager Vault Access
id: downpour-sigma-024
status: stable
level: medium
description: Detects vaultcmd.exe enumeration of stored credentials
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\vaultcmd.exe'
    selection_args:
        CommandLine|contains:
            - '/list'
            - '/listcreds'
            - '/listproperties'
    condition: selection_img and selection_args
tags:
    - attack.credential_access
    - attack.t1555
