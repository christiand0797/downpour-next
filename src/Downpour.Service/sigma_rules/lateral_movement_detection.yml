title: PsExec Service Installation
id: downpour-sigma-050
status: stable
level: high
description: Detects PsExec service installation (lateral movement)
logsource:
    category: process_creation
    product: windows
detection:
    selection_psexec:
        Image|endswith:
            - '\PsExec.exe'
            - '\PsExec64.exe'
            - '\PSEXESVC.exe'
    selection_cmdline:
        CommandLine|contains:
            - '\\\\'
            - '-s cmd'
            - '-accepteula'
    condition: 1 of selection_*
tags:
    - attack.lateral_movement
    - attack.t1021.002
    - attack.t1569.002
