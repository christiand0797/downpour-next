title: Scheduled Task XML Import
id: b6c7d8e9-4f5a-6b7c-8d9e-0f1a2b3c4d5e
status: experimental
description: Detects scheduled task creation from XML file (potential payload delivery)
logsource:
    category: process_creation
    product: windows
detection:
    sel_schtasks:
        Image|endswith:
            - '\schtasks.exe'
    sel_xml:
        CommandLine|contains:
            - '/xml'
            - '/XML'
    condition: sel_schtasks and sel_xml
level: medium
tags:
    - attack.persistence
    - attack.t1053.005
falsepositives:
    - GPO-managed scheduled tasks
    - Software deployment tools

