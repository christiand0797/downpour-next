title: Scheduled Task Executing from Suspicious Path
id: f4a5b6c7-2d3e-4f5a-6b7c-8d9e0f1a2b3c
status: experimental
description: Detects scheduled tasks that execute from temp, user, or download directories
logsource:
    category: process_creation
    product: windows
detection:
    sel_schtasks:
        Image|endswith:
            - '\schtasks.exe'
    sel_create:
        CommandLine|contains:
            - '/create'
    sel_path:
        CommandLine|contains:
            - '\\Temp\\'
            - '\\tmp\\'
            - '\\Downloads\\'
            - '\\AppData\\Local\\'
            - '\\AppData\\Roaming\\'
            - '\\ProgramData\\'
            - '\\Users\\Public\\'
            - '%TEMP%'
            - '%APPDATA%'
            - '%PUBLIC%'
    condition: sel_schtasks and sel_create and sel_path
level: high
tags:
    - attack.persistence
    - attack.t1053.005
falsepositives:
    - Software installers that create scheduled tasks in user directories

---

title: Scheduled Task Remote Creation
id: a5b6c7d8-3e4f-5a6b-7c8d-9e0f1a2b3c4d
status: experimental
description: Detects remote scheduled task creation for lateral movement
logsource:
    category: process_creation
    product: windows
detection:
    sel_schtasks:
        Image|endswith:
            - '\schtasks.exe'
    sel_remote:
        CommandLine|contains:
            - '/s '
            - '/S '
            - '/create /tn'
    sel_create:
        CommandLine|contains:
            - '/create'
    condition: sel_schtasks and sel_create and sel_remote
level: high
tags:
    - attack.lateral_movement
    - attack.persistence
    - attack.t1053.005
falsepositives:
    - Remote administration tools

