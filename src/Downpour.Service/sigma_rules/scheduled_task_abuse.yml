title: Scheduled Task Masquerading as System Task
id: c7d8e9f0-5a6b-7c8d-9e0f-1a2b3c4d5e6f
status: experimental
description: Detects scheduled tasks using names that mimic Windows system tasks
logsource:
    category: process_creation
    product: windows
detection:
    sel_schtasks:
        Image|endswith:
            - '\schtasks.exe'
    sel_create:
        CommandLine|contains:
            - '/create'
    sel_masquerade:
        CommandLine|contains:
            - '\Microsoft\Windows\WindowsUpdate'
            - '\Microsoft\Windows\Maintenance'
            - '\Microsoft\Windows\Defrag'
            - 'WindowsUpdate'
            - 'SystemRestore'
            - 'OneDriveSync'
            - 'GoogleUpdate'
            - 'AdobeUpdate'
    condition: sel_schtasks and sel_create and sel_masquerade
level: high
tags:
    - attack.persistence
    - attack.defense_evasion
    - attack.t1053.005
    - attack.t1036.005
falsepositives:
    - Actual system or vendor update tasks (verify publisher)
