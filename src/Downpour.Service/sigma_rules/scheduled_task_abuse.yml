title: Scheduled Task Created via Command Line
id: e3f4a5b6-1c2d-3e4f-5a6b-7c8d9e0f1a2b
status: experimental
description: Detects scheduled task creation via schtasks.exe with suspicious parameters
logsource:
    category: process_creation
    product: windows
detection:
    sel_schtasks:
        Image|endswith:
            - '\schtasks.exe'
    sel_create:
        CommandLine|contains:
            - '/create'
            - '/Create'
    sel_suspicious:
        CommandLine|contains:
            - '/sc onlogon'
            - '/sc onidle'
            - '/sc onstart'
            - '/sc ONLOGON'
            - '/sc ONIDLE'
            - '/sc ONSTART'
            - '/ru SYSTEM'
            - '/ru system'
            - 'powershell'
            - 'cmd.exe /c'
            - 'mshta'
            - 'rundll32'
            - 'regsvr32'
            - 'wscript'
            - 'cscript'
            - 'certutil'
            - 'bitsadmin'
    condition: sel_schtasks and sel_create and sel_suspicious
level: high
tags:
    - attack.persistence
    - attack.t1053.005
falsepositives:
    - Legitimate administration tasks

