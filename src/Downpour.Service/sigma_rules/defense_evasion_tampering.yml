title: AMSI Provider Registry Tampering
id: downpour-sigma-031
status: stable
level: critical
description: Detects registry modifications to AMSI provider entries
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains:
            - 'AMSI\\Providers'
            - '{2781761E-28E0-4109-99FE-B9D127C57AFE}'
    condition: selection
tags:
    - attack.defense_evasion
    - attack.t1562.001
