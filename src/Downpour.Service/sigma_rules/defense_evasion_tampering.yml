title: Windows Defender Real-Time Protection Disabled
id: downpour-sigma-030
status: stable
level: critical
description: Detects attempts to disable Windows Defender real-time protection via registry
logsource:
    category: process_creation
    product: windows
detection:
    selection_reg:
        Image|endswith: '\reg.exe'
    selection_defender:
        CommandLine|contains:
            - 'DisableRealtimeMonitoring'
            - 'DisableBehaviorMonitoring'
            - 'DisableOnAccessProtection'
            - 'DisableScanOnRealtimeEnable'
            - 'DisableIOAVProtection'
    condition: selection_reg and selection_defender
tags:
    - attack.defense_evasion
    - attack.t1562.001
