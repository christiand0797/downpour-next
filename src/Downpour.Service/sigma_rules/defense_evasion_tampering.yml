title: Event Log Service Stopped or Disabled
id: downpour-sigma-032
status: stable
level: critical
description: Detects stopping or disabling of Windows Event Log service
logsource:
    category: process_creation
    product: windows
detection:
    selection_sc:
        Image|endswith: '\sc.exe'
        CommandLine|contains:
            - 'EventLog'
        CommandLine|contains:
            - 'stop'
            - 'disabled'
            - 'delete'
    condition: selection_sc
tags:
    - attack.defense_evasion
    - attack.t1562.002
