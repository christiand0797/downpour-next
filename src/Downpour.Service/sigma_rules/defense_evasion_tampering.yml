title: Event Log Cleared via Wevtutil
id: downpour-sigma-033
status: stable
level: high
description: Detects clearing of Windows event logs via wevtutil
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\wevtutil.exe'
    selection_args:
        CommandLine|contains:
            - ' cl '
            - ' clear-log '
    condition: selection_img and selection_args
tags:
    - attack.defense_evasion
    - attack.t1070.001
---
title: Shadow Copy Deletion
id: downpour-sigma-034
status: stable
level: critical
description: Detects deletion of volume shadow copies (ransomware indicator)
logsource:
    category: process_creation
    product: windows
detection:
    selection_vssadmin:
        Image|endswith: '\vssadmin.exe'
        CommandLine|contains: 'delete shadows'
    selection_wmic:
        Image|endswith: '\wmic.exe'
        CommandLine|contains: 'shadowcopy delete'
    selection_ps:
        CommandLine|contains:
            - 'Get-WmiObject Win32_ShadowCopy | ForEach-Object'
            - 'Win32_ShadowCopy'
    condition: 1 of selection_*
tags:
    - attack.impact
    - attack.t1490
---
title: Firewall Rule Modification via Netsh
id: downpour-sigma-035
status: stable
level: medium
description: Detects netsh used to add or delete firewall rules
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\netsh.exe'
    selection_args:
        CommandLine|contains:
            - 'firewall'
            - 'advfirewall'
    selection_action:
        CommandLine|contains:
            - 'add rule'
            - 'delete rule'
            - 'set rule'
            - 'set allprofiles state off'
    condition: selection_img and selection_args and selection_action
tags:
    - attack.defense_evasion
    - attack.t1562.004
