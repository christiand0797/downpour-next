title: Suspicious Periodic Network Connection
id: d29-beacon-002
status: stable
level: medium
description: Detects processes making regular periodic connections (beacon-like)
author: Downpour v29
date: 2026/09/16
logsource:
    category: process_creation
    product: windows
detection:
    sel_curl_loop:
        CommandLine|contains:
            - 'curl'
            - 'wget'
        CommandLine|contains:
            - '--retry'
            - '-retry'
            - 'loop'
            - 'sleep'
    sel_ncat:
        Image|endswith:
            - '\ncat.exe'
            - '\nc.exe'
            - '\netcat.exe'
    sel_reverse:
        CommandLine|contains:
            - 'reverse'
            - 'connect-back'
            - 'callback'
        CommandLine|contains:
            - '.exe'
    condition: 1 of sel*
tags:
    - attack.command_and_control
    - attack.t1071
    - attack.t1095
falsepositives:
    - Legitimate monitoring scripts
    - System health checks
---
title: Browser Extension Sideloading
id: d29-browser-001
status: stable
level: high
description: Detects browser extension sideloading via command line
author: Downpour v29
date: 2026/09/16
logsource:
    category: process_creation
    product: windows
detection:
    sel_chrome_ext:
        Image|endswith:
            - '\chrome.exe'
            - '\msedge.exe'
            - '\brave.exe'
        CommandLine|contains:
            - '--load-extension='
            - '--disable-extensions-except='
    sel_reg_ext:
        Image|endswith: '\reg.exe'
        CommandLine|contains:
            - 'ExtensionInstallForceList'
            - 'ExtensionInstallAllowlist'
            - 'ExtensionSettings'
    condition: 1 of sel*
tags:
    - attack.persistence
    - attack.t1176
falsepositives:
    - Developer testing
    - Enterprise extension management
