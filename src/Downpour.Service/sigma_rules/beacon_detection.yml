title: C2 Beacon Communication Pattern
id: d29-beacon-001
status: stable
level: high
description: Detects process command lines associated with C2 beacon frameworks
author: Downpour v29
date: 2026/09/16
logsource:
    category: process_creation
    product: windows
detection:
    sel_cobalt:
        CommandLine|contains:
            - 'beacon.exe'
            - 'cobaltstrike'
            - 'artifact.exe'
            - 'pipename='
    sel_sliver:
        CommandLine|contains:
            - 'sliver-client'
            - 'sliver-server'
            - '.woff --'
    sel_mythic:
        CommandLine|contains:
            - 'mythic_agent'
            - 'apfell'
    sel_havoc:
        CommandLine|contains:
            - 'havoc.exe'
            - 'demon.x64'
            - 'demon.x86'
    sel_bruteratel:
        CommandLine|contains:
            - 'badger'
            - 'brute_ratel'
            - 'brc4'
    condition: 1 of sel*
tags:
    - attack.command_and_control
    - attack.t1071
    - attack.t1573
falsepositives:
    - Security testing tools in authorized use
