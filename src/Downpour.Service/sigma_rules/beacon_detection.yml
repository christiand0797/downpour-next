title: Bluetooth Reconnaissance
id: d29-bt-001
status: stable
level: medium
description: Detects Bluetooth scanning and reconnaissance tools
author: Downpour v29
date: 2026/09/16
logsource:
    category: process_creation
    product: windows
detection:
    sel_bt_tools:
        CommandLine|contains:
            - 'btscanner'
            - 'bluescanner'
            - 'blescan'
            - 'ubertooth'
            - 'bluescan'
            - 'redfang'
    sel_bt_enum:
        CommandLine|contains:
            - 'bluetooth'
            - 'btaddr'
        CommandLine|contains:
            - 'scan'
            - 'enum'
            - 'discover'
    condition: 1 of sel*
tags:
    - attack.discovery
    - attack.t1120
    - attack.t1200
falsepositives:
    - Legitimate Bluetooth management tools
