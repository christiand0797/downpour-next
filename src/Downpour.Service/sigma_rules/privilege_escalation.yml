title: UAC Bypass via Fodhelper Registry Hijack
id: downpour-sigma-090
status: stable
level: critical
description: Detects registry modifications for UAC bypass via fodhelper.exe
logsource:
    category: process_creation
    product: windows
detection:
    selection_reg:
        Image|endswith: '\reg.exe'
    selection_key:
        CommandLine|contains:
            - 'ms-settings\\Shell\\Open\\command'
            - 'ms-settings\\shell\\open\\command'
    condition: selection_reg and selection_key
tags:
    - attack.privilege_escalation
    - attack.defense_evasion
    - attack.t1548.002
