title: DLL Hijack in System Directory
id: downpour-sigma-095
status: stable
level: high
description: Detects copy or move of DLL files into system directories
logsource:
    category: process_creation
    product: windows
detection:
    selection_cmd:
        Image|endswith:
            - '\cmd.exe'
            - '\xcopy.exe'
            - '\robocopy.exe'
    selection_dll:
        CommandLine|contains: '.dll'
    selection_target:
        CommandLine|contains:
            - 'System32'
            - 'SysWOW64'
            - 'Program Files'
    condition: selection_cmd and selection_dll and selection_target
tags:
    - attack.persistence
    - attack.privilege_escalation
    - attack.t1574.001
