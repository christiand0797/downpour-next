title: Token Impersonation via Named Pipe
id: downpour-sigma-092
status: stable
level: high
description: Detects potential token impersonation via named pipe creation tools
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains:
            - 'ImpersonateNamedPipeClient'
            - 'CreateNamedPipe'
            - 'ConnectNamedPipe'
            - 'potato'
            - 'juicypotato'
            - 'rottenpotato'
            - 'sweetpotato'
            - 'godpotato'
            - 'printspoofer'
    condition: selection
tags:
    - attack.privilege_escalation
    - attack.t1134.001
