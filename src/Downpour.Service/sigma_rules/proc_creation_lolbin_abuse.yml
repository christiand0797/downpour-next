title: BITSAdmin Download or Transfer
id: downpour-sigma-003
status: stable
level: medium
description: Detects bitsadmin.exe used for file transfers
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\bitsadmin.exe'
    selection_args:
        CommandLine|contains:
            - '/transfer'
