title: WMIC Process Call Create
id: downpour-sigma-007
status: stable
level: high
description: Detects WMIC used to spawn processes remotely or locally
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\wmic.exe'
    selection_args:
        CommandLine|contains:
            - 'process call create'
            - 'process call '
    condition: selection_img and selection_args
tags:
    - attack.execution
    - attack.t1047
