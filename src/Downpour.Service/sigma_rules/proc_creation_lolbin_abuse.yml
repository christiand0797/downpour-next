title: Rundll32 Executing JavaScript or VBScript
id: downpour-sigma-004
status: stable
level: critical
description: Detects rundll32 executing script content via mshtml or javascript protocol
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\rundll32.exe'
    selection_args:
        CommandLine|contains:
            - 'javascript:'
            - 'vbscript:'
            - 'mshtml'
            - 'RunHTMLApplication'
    condition: selection_img and selection_args
tags:
    - attack.defense_evasion
    - attack.t1218.011
