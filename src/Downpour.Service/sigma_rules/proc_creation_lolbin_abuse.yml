title: Certutil Download or Decode Activity
id: downpour-sigma-001
status: stable
level: high
description: Detects certutil.exe used to download files or decode base64 content
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\certutil.exe'
    selection_args:
        CommandLine|contains:
            - 'urlcache'
            - '-decode'
            - '/decode'
            - '-urlcache'
            - '/urlcache'
            - '-decodehex'
            - '/decodehex'
    condition: selection_img and selection_args
tags:
    - attack.defense_evasion
    - attack.t1140
    - attack.command_and_control
    - attack.t1105
---
title: Msiexec Remote Package Installation
id: downpour-sigma-002
status: stable
level: high
description: Detects msiexec.exe installing a package from a remote URL
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\msiexec.exe'
    selection_url:
        CommandLine|contains:
            - 'http://'
            - 'https://'
            - 'ftp://'
    condition: selection_img and selection_url
tags:
    - attack.defense_evasion
    - attack.t1218.007
