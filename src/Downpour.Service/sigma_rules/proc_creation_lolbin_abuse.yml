title: Regsvr32 Scriptlet Execution (Squiblydoo)
id: downpour-sigma-005
status: stable
level: high
description: Detects regsvr32 loading remote scriptlets for code execution
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\regsvr32.exe'
    selection_args:
        CommandLine|contains:
            - '/i:http'
