title: CMSTP INF File Execution
id: downpour-sigma-081
status: stable
level: high
description: Detects CMSTP.exe loading INF files for UAC bypass or code execution
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\cmstp.exe'
    selection_inf:
        CommandLine|contains:
            - '.inf'
            - '/ni'
            - '/au'
            - '/s'
    condition: selection_img and selection_inf
tags:
    - attack.defense_evasion
    - attack.execution
    - attack.t1218.003
