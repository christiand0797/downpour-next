title: Wscript or Cscript Executing Remote Script
id: downpour-sigma-084
status: stable
level: high
description: Detects Windows Script Host executing scripts from remote or suspicious locations
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\wscript.exe'
            - '\cscript.exe'
    selection_suspicious:
        CommandLine|contains:
            - 'http://'
            - 'https://'
            - '\\\\'
            - '%temp%'
            - '%appdata%'
            - 'ProgramData'
    condition: selection_img and selection_suspicious
tags:
    - attack.execution
    - attack.t1059.005
    - attack.t1059.007
