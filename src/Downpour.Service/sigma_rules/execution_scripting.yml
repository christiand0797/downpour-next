title: MSHTA Executing Remote HTA
id: downpour-sigma-080
status: stable
level: critical
description: Detects mshta.exe loading remote HTA files for code execution
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\mshta.exe'
    selection_remote:
        CommandLine|contains:
            - 'http://'
            - 'https://'
            - 'ftp://'
            - 'javascript:'
            - 'vbscript:'
    condition: selection_img and selection_remote
tags:
    - attack.execution
    - attack.defense_evasion
    - attack.t1218.005
