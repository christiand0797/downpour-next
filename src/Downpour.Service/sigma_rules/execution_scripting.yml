title: Control Panel Item Execution
id: downpour-sigma-086
status: stable
level: medium
description: Detects control.exe loading CPL files from unusual locations
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\control.exe'
    selection_suspicious:
        CommandLine|contains:
            - '%temp%'
            - '%appdata%'
            - 'Downloads'
            - '\\\\'
    condition: selection_img and selection_suspicious
