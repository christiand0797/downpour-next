title: InstallUtil CLR Code Execution
id: downpour-sigma-082
status: stable
level: high
description: Detects InstallUtil.exe used to execute .NET assemblies (AppLocker bypass)
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\InstallUtil.exe'
    selection_args:
        CommandLine|contains:
            - '/logfile='
            - '/LogToConsole=false'
            - '/U'
    condition: selection_img and selection_args
tags:
    - attack.defense_evasion
    - attack.t1218.004
