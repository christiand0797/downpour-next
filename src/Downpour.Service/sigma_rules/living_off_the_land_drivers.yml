title: Sysmon Driver Unload Attempt
id: c9d0e1f2-9012-cdef-0123-456789012cde
status: experimental
description: Detects attempts to unload Sysmon driver to blind monitoring
logsource:
    category: process_creation
    product: windows
detection:
    sel_fltmc:
        Image|endswith:
            - '\fltMC.exe'
    sel_unload:
        CommandLine|contains:
            - 'unload'
    sel_sysmon:
        CommandLine|contains:
            - 'SysmonDrv'
            - 'sysmon'
    condition: sel_fltmc and sel_unload and sel_sysmon
level: critical
tags:
    - attack.defense_evasion
    - attack.t1562.001
falsepositives:
    - Legitimate Sysmon maintenance

