title: Minifilter Driver Unload (Security Product Blinding)
id: d0e1f2a3-0123-def0-1234-56789012def0
status: experimental
description: Detects minifilter driver unloading used to disable security products
logsource:
    category: process_creation
    product: windows
detection:
    sel_fltmc:
        Image|endswith:
            - '\fltMC.exe'
    sel_unload:
        CommandLine|contains:
            - 'unload'
    sel_security_drivers:
        CommandLine|contains:
            - 'WdFilter'
            - 'MpFilter'
            - 'csagent'
            - 'CrowdStrike'
            - 'cbfilter'
            - 'SentinelMonitor'
            - 'sophos'
            - 'symefa'
            - 'eset'
    condition: sel_fltmc and sel_unload and sel_security_drivers
level: critical
tags:
    - attack.defense_evasion
    - attack.t1562.001
falsepositives:
    - Legitimate driver maintenance during security product updates

