title: Vulnerable Driver Loading via sc.exe
id: a7b8c9d0-7890-abcd-ef01-2345678901ab
status: experimental
description: Detects creation and loading of kernel drivers commonly abused in BYOVD attacks
logsource:
    category: process_creation
    product: windows
detection:
    sel_sc:
        Image|endswith:
            - '\sc.exe'
    sel_create:
        CommandLine|contains:
            - 'create'
    sel_kernel:
        CommandLine|contains:
            - 'type= kernel'
            - 'type=kernel'
            - 'binPath='
            - 'binpath='
    sel_driver_name:
        CommandLine|contains:
            - 'RTCore'
            - 'DBUtil'
            - 'gdrv'
            - 'WinRing0'
            - 'cpuz'
            - 'AsIO'
            - 'EneIo'
            - 'MsIo'
            - 'GLCKIO'
            - 'physmem'
            - 'HpPortIo'
            - 'atillk'
            - 'iQVW64'
            - 'ProcExp'
    condition: sel_sc and sel_create and sel_kernel and sel_driver_name
level: critical
tags:
    - attack.privilege_escalation
    - attack.t1068
falsepositives:
    - Legitimate hardware monitoring tool installation

