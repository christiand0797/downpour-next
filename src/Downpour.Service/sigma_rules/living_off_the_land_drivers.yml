title: Unsigned Driver Load via bcdedit
id: e1f2a3b4-1234-ef01-2345-6789012ef012
status: experimental
description: Detects enabling test signing mode to allow unsigned driver loading
logsource:
    category: process_creation
    product: windows
detection:
    sel_bcdedit:
        Image|endswith:
            - '\bcdedit.exe'
    sel_testsigning:
        CommandLine|contains:
            - 'testsigning'
            - 'TESTSIGNING'
    sel_on:
        CommandLine|contains:
            - ' on'
            - ' ON'
            - ' yes'
            - ' YES'
    condition: sel_bcdedit and sel_testsigning and sel_on
level: critical
tags:
    - attack.defense_evasion
    - attack.t1553.006
falsepositives:
    - Driver development environments
