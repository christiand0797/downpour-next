title: Driver Loading via Rundll32 InstallHinfSection
id: b8c9d0e1-8901-bcde-f012-3456789012bc
status: experimental
description: Detects driver installation via rundll32 setupapi (BYOVD delivery)
logsource:
    category: process_creation
    product: windows
detection:
    sel_rundll32:
        Image|endswith:
            - '\rundll32.exe'
    sel_setupapi:
        CommandLine|contains:
            - 'setupapi'
            - 'InstallHinfSection'
            - 'advpack'
            - 'LaunchINFSection'
    condition: sel_rundll32 and sel_setupapi
level: high
tags:
    - attack.defense_evasion
    - attack.t1218.011
falsepositives:
    - Legitimate driver installation

