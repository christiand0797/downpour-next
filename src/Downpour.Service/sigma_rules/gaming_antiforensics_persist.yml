title: Data Exfiltration Tool Execution
id: d29-sigma-exfil-tools-001
status: stable
level: critical
description: Detects execution of data exfiltration tools including rclone, mega, DNS tunneling
author: Downpour v29 Titanium
date: 2024/12/01
logsource:
  category: process_creation
  product: windows
detection:
  sel_rclone:
    CommandLine|contains:
      - 'rclone copy'
      - 'rclone sync'
      - 'rclone move'
  sel_mega:
    Image|endswith:
      - '\megacmd.exe'
      - '\mega-put.exe'
  sel_dns_tunnel:
    CommandLine|contains:
      - 'dnscat'
      - 'iodine'
      - 'dns2tcp'
  sel_anon_upload:
    CommandLine|contains:
      - 'transfer.sh'
      - 'file.io'
      - 'gofile.io'
      - 'anonfiles'
  condition: 1 of sel*
tags:
  - attack.exfiltration
  - attack.t1048
  - attack.t1567

