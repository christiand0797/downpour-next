title: Gaming Cheat Tool Execution
id: d29-sigma-gaming-cheat-001
status: stable
level: high
description: Detects game cheating tools, memory editors, and DDoS tools used against gamers
author: Downpour v29 Titanium
date: 2024/12/01
logsource:
  category: process_creation
  product: windows
detection:
  sel_cheat_engine:
    Image|endswith:
      - '\cheatengine-x86_64.exe'
      - '\CheatEngine.exe'
      - '\ce.exe'
  sel_memory_editor:
    Image|endswith:
      - '\artmoney.exe'
      - '\WeMod.exe'
      - '\PLITCH.exe'
  sel_injector:
    Image|endswith:
      - '\ExtremeInjector.exe'
      - '\Xenos.exe'
  sel_ddos_tool:
    CommandLine|contains:
      - 'LOIC'
      - 'HOIC'
      - 'slowloris'
      - 'hping'
      - 'lag switch'
  sel_lag_tool:
    Image|endswith:
      - '\clumsy.exe'
      - '\NetLimiter.exe'
  condition: 1 of sel*
tags:
  - attack.execution
  - attack.t1055
  - attack.t1498

