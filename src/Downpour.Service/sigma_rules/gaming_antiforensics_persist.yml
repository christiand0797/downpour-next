title: WMI Event Subscription Persistence
id: d29-sigma-wmi-persist-001
status: stable
level: critical
description: Detects WMI event subscription creation for persistence
author: Downpour v29 Titanium
date: 2024/12/01
logsource:
  category: process_creation
  product: windows
detection:
  sel_wmi_consumer:
    CommandLine|contains:
      - 'CommandLineEventConsumer'
      - 'ActiveScriptEventConsumer'
  sel_wmi_filter:
    CommandLine|contains:
      - '__EventFilter'
      - '__FilterToConsumerBinding'
  sel_mofcomp:
    Image|endswith:
      - '\mofcomp.exe'
  condition: 1 of sel*
tags:
  - attack.persistence
  - attack.t1546.003
