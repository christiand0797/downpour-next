title: Anti-Forensics Evidence Destruction
id: d29-sigma-antifor-tools-001
status: stable
level: critical
description: Detects anti-forensics tools and evidence destruction
author: Downpour v29 Titanium
date: 2024/12/01
logsource:
  category: process_creation
  product: windows
detection:
  sel_secure_delete:
    Image|endswith:
      - '\sdelete.exe'
      - '\sdelete64.exe'
      - '\eraser.exe'
  sel_log_clear:
    CommandLine|contains:
      - 'wevtutil cl'
      - 'wevtutil clear-log'
  sel_audit_tamper:
    CommandLine|contains:
      - 'auditpol /clear'
      - 'auditpol /remove'
  sel_prefetch_del:
    CommandLine|contains:
      - 'del /q /f'
      - 'Prefetch'
  sel_usn_journal:
    CommandLine|contains:
      - 'fsutil usn deletejournal'
  condition: 1 of sel*
tags:
  - attack.defense_evasion
  - attack.t1070
  - attack.t1070.001
  - attack.t1070.004

